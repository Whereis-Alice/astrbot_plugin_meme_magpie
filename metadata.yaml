desc: 让 AstrBot 自动收集群聊里的表情包，用视觉模型识别内容并分类入库，聊天时按情绪自动挑一张发出去。支持 LLM 主动检索/发送/收录表情包（可由 LLM 直接回填作品、角色、动作等参数），提供 WebUI 管理面板、批量导入与批量重新识别（可配置并发与速率上限，避免触发上游 429）、语义检索、存储清理，并内置从 astrbot_plugin_stealer 迁移数据的指令。
short_desc: 自动收集群聊表情包，AI 识别分类入库，聊天时按情绪自动发送，并提供 WebUI 管理。
