name: astrbot_plugin_meme_magpie
display_name: meme神偷
author: Whereis-Alice
author_url: https://github.com/Whereis-Alice
desc: 让 AstrBot 自动收集群聊里的表情包，用视觉模型识别内容并打上语义标签，聊天时按情绪自动挑一张发回去。支持 LLM 主动搜索/发送/收录表情包（可由 LLM 直接回填作品、角色、动作等参数），提供 WebUI 管理表情库、批量导入与限速可控的批量识别（可配置并发与速率上限，避免触发上游 429），并内置从 astrbot_plugin_stealer 迁移数据的指令。
short_desc: 自动收集群聊表情包，AI 识别内容与情绪，聊天时按语境自动发送，附带 WebUI 管理面板。
repo: https://github.com/Whereis-Alice/astrbot_plugin_meme_magpie
category: 娱乐
tags:
  - 表情包
