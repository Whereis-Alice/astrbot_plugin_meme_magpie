  - 群聊
help: |
  meme神偷：自动收集群聊里的表情包，用视觉模型识别内容与情绪，聊天时按语境自动发送。

  指令前缀是 mp，同时保留别名 magpie 和 神偷（写哪个都一样）。
  下面示例统一按 AstrBot 出厂唤醒前缀 / 书写；如果你把唤醒前缀改成了 ! # . 之类，
  请把 /mp 换成 !mp、#mp；如果你清空了唤醒前缀，就直接私聊或 @机器人 后写 mp xxx。
  拿不准的时候发 /mp help，它会按你当前的真实前缀把命令重新打印一遍。

  查询指令（所有人可用）：
  - /mp status：查看开关状态与容量统计
  - /mp list [分类] [每页数量] [页码]：翻看已收录的表情包
  - /mp emotion_stats：查看情绪分布统计
  - /mp help：按当前唤醒前缀打印完整子命令清单

  开关指令（管理员）：
  - /mp on | /mp off：开启 / 关闭表情包收集
  - /mp auto_on | /mp auto_off：开启 / 关闭自动发送
  - /mp group show：查看群聊 / 用户的收集与发送黑白名单（只写 /mp group 会先打印用法）
  - /mp 偷：开启 30 秒强制收录模式，期间群里的图片一律入库
  - /mp natural_analysis：切换自然语言情绪分析开关

  管理指令（管理员）：
  - /mp delete <序号|文件名>：删除表情包
  - /mp blacklist <序号|文件名>：删除并加入黑名单，之后不再重复收录
  - /mp scope <序号|文件名> <public|local>：设置表情包的可见范围
  - /mp clean：清理未入库的暂存图片（已入库的表情包不受影响）
  - /mp capacity：立即执行容量上限清理（会删掉超出上限的最旧表情包，只看容量请用 /mp status）
  - /mp tag_stats [N]：标签体检（高频 / 低频 / 无标签）
  - /mp clear_emotion_cache：清理情绪匹配缓存
  - /mp rebuild_index：重建检索索引（不会删图）
  - /mp rebuild_vectors：重建语义检索向量（改过描述但搜出来还是旧内容时用）

  数据迁移（管理员，用于从 astrbot_plugin_stealer 搬家）：
  - /mp migrate：预演，只打印"如果执行会发生什么"，一个字节都不写
  - /mp migrate check：只检查能否找到旧插件的数据目录
  - /mp migrate apply：真正执行（复制文件，旧数据保留，可重复执行）
  - /mp migrate move：真正执行并搬走图片文件（更省磁盘）

  对话中 LLM 可自动调用三个工具：magpie_search_meme 搜索表情包、magpie_send_meme 发送表情包、
  magpie_steal_meme 主动收录图片。LLM 可以顺手把作品、角色、动作、情绪等信息一起写进数据库，
  比只靠事后视觉分析准得多。

  WebUI：在插件管理页面打开"表情神偷管理面板"，可浏览 / 编辑 / 批量导入 / 批量重新识别 / 识别失败检测；
  批量识别支持配置并发数与每分钟请求上限，并实时显示进度、预估剩余时间和失败明细。
version: 1.5.0
