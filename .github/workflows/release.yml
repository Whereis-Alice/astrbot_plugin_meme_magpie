name: Auto Release

# metadata.yaml 的 version 一变就发一个 Release。
# 正文从 CHANGELOG.md 里对应版本的那一节直接拿，而不是只贴一串 commit。

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'metadata.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要完整的 tag 列表来判断这个版本是不是已经发过
          fetch-depth: 0

      - name: Resolve version and release notes
        id: meta
        run: python3 .github/scripts/release_notes.py

      - name: Skip notice
        if: steps.meta.outputs.tag_exists == 'true'
        run: echo "tag ${{ steps.meta.outputs.tag }} 已存在，跳过发布"

      - name: Create Release
        if: steps.meta.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.meta.outputs.notes_path }}
          generate_release_notes: ${{ steps.meta.outputs.has_notes == 'false' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
